<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="110" width="210" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="145.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one test run</text>
<text x="145.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">one interleaving</text>
<text x="145.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">of very many</text>
<rect x="330" y="50" width="250" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="455.0" y="76.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">green</text>
<text x="455.0" y="93.0" font-size="11.5" fill="#555555" text-anchor="middle">this schedule happened to work</text>
<rect x="330" y="194" width="250" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="455.0" y="220.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a race still hides</text>
<text x="455.0" y="237.0" font-size="11.5" fill="#555555" text-anchor="middle">in a schedule not sampled</text>
<rect x="660" y="50" width="230" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="775.0" y="76.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ThreadSanitizer</text>
<text x="775.0" y="93.0" font-size="11.5" fill="#555555" text-anchor="middle">flags the race on any run</text>
<rect x="660" y="194" width="230" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="775.0" y="220.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">repetition</text>
<text x="775.0" y="237.0" font-size="11.5" fill="#555555" text-anchor="middle">samples more schedules</text>
<path d="M250,130 L330,86" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M250,170 L330,214" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M580,78 L660,78" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M580,222 L660,222" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="460" y="290" font-size="11" fill="#1d1d1d" text-anchor="middle">a passing run narrows the doubt; the sanitizer and repetition close it</text>
</svg>