<text x="160.0" y="170.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">caller broke a contract</text>
<text x="160.0" y="187.0" font-size="11.5" fill="#555555" text-anchor="middle">bad argument at the API</text>
<rect x="340" y="144" width="260" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="470.0" y="170.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">throw std::invalid_argument</text>
<text x="470.0" y="187.0" font-size="11.5" fill="#555555" text-anchor="middle">with a message</text>
<rect x="660" y="144" width="280" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="177.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EXPECT_THROW, then what()</text>
<rect x="40" y="224" width="240" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="250.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">programming bug</text>
<text x="160.0" y="267.0" font-size="11.5" fill="#555555" text-anchor="middle">an impossible state</text>
<rect x="340" y="224" width="260" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="470.0" y="250.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">assert, then abort</text>
<text x="470.0" y="267.0" font-size="11.5" fill="#555555" text-anchor="middle">terminate the process</text>
<rect x="660" y="224" width="280" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="257.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EXPECT_DEATH(stmt, regex)</text>
