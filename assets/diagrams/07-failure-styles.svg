<text x="160.0" y="107.0" font-size="11.5" fill="#555555" text-anchor="middle">bad weight text</text>
<rect x="340" y="64" width="260" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="470.0" y="90.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">std::expected&lt;int, E&gt;</text>
