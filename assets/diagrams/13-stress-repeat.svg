<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="90" width="250" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="165.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">--gtest_repeat=N</text>
<text x="165.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">--gtest_shuffle</text>
<text x="165.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">N runs, each reordered</text>
<rect x="370" y="50" width="230" height="54" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="485.0" y="75.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">most iterations pass</text>
<text x="485.0" y="92.0" font-size="11.5" fill="#555555" text-anchor="middle">the common schedules</text>
<rect x="370" y="150" width="230" height="54" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="485.0" y="175.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one iteration fails</text>
<text x="485.0" y="192.0" font-size="11.5" fill="#555555" text-anchor="middle">a rare order or timing</text>
<rect x="680" y="150" width="230" height="54" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="795.0" y="175.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">now reproducible</text>
<text x="795.0" y="192.0" font-size="11.5" fill="#555555" text-anchor="middle">a seed to debug from</text>
<path d="M290,110 L370,77" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,140 L370,177" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M600,177 L680,177" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="470" y="230" font-size="11" fill="#1d1d1d" text-anchor="middle">repetition turns a once-in-a-while failure into one you can catch</text>
</svg>