<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="90" y="40" width="330" height="52" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="255.0" y="71.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">construct a fresh ManifestTest</text>
<rect x="90" y="128" width="330" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="255.0" y="156.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SetUp()</text>
<text x="255.0" y="173.0" font-size="11.5" fill="#555555" text-anchor="middle">manifest_.add(1000); add(2500)</text>
<rect x="90" y="224" width="330" height="52" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="255.0" y="255.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the TEST_F body runs</text>
<rect x="90" y="312" width="330" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="255.0" y="340.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">destruct</text>
<text x="255.0" y="357.0" font-size="11.5" fill="#555555" text-anchor="middle">~Manifest frees the vector</text>
<rect x="500" y="128" width="290" height="156" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="645.0" y="189.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Repeats for every TEST_F.</text>
<text x="645.0" y="206.0" font-size="11.5" fill="#555555" text-anchor="middle">Each test gets its own</text>
<text x="645.0" y="221.0" font-size="11.5" fill="#555555" text-anchor="middle">instance, so no test sees</text>
<text x="645.0" y="236.0" font-size="11.5" fill="#555555" text-anchor="middle">another test&#x27;s state.</text>
<path d="M255,92 L255,128" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M255,188 L255,224" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M255,276 L255,312" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
</svg>