<text x="240.0" y="204.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EXPECT_EQ(shipments[0], 1000)</text>
<rect x="70" y="252" width="340" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="280.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EXPECT_EQ(shipments[1], 1000)</text>
<rect x="70" y="328" width="340" height="46" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="356.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EXPECT_EQ(shipments[2], 500)</text>
<rect x="560" y="70" width="230" height="58" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="675.0" y="97.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">stop the test (fatal)</text>
<text x="675.0" y="114.0" font-size="11.5" fill="#555555" text-anchor="middle">the lines below never run</text>
<rect x="560" y="252" width="230" height="46" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="675.0" y="280.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">record failure, keep going</text>
