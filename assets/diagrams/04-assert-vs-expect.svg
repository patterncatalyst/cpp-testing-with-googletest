<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="30" width="450" height="366" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="50" font-size="12" font-weight="700" fill="#1d1d1d">one TEST body (runs top to bottom)</text>
<rect x="70" y="70" width="340" height="58" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="240.0" y="97.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ASSERT_EQ(shipments.size(), 3)</text>
<text x="240.0" y="114.0" font-size="11.5" fill="#555555" text-anchor="middle">check the precondition</text>
