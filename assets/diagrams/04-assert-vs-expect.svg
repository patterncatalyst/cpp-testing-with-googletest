<text x="491.0" y="93.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">fail</text>
<text x="491.0" y="93.0" font-size="11" fill="#b8650a" text-anchor="middle">fail</text>
