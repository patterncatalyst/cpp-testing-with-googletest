<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="44" width="600" height="200" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="64" font-size="12" font-weight="700" fill="#1d1d1d">one binary: asan-ubsan</text>
<rect x="640" y="44" width="300" height="200" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="652" y="64" font-size="12" font-weight="700" fill="#1d1d1d">a separate binary: tsan</text>
<rect x="40" y="84" width="180" height="64" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="130.0" y="114.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AddressSanitizer</text>
<text x="130.0" y="131.0" font-size="11.5" fill="#555555" text-anchor="middle">memory errors</text>
<rect x="250" y="84" width="350" height="64" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="425.0" y="114.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">use-after-free, buffer overflow, leaks</text>
<text x="425.0" y="131.0" font-size="11.5" fill="#555555" text-anchor="middle">catches: a dangling span</text>
<rect x="40" y="164" width="180" height="64" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="130.0" y="194.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">UndefinedBehavior</text>
<text x="130.0" y="211.0" font-size="11.5" fill="#555555" text-anchor="middle">Sanitizer</text>
<rect x="250" y="164" width="350" height="64" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="425.0" y="194.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">overflow, bad shift, misalignment</text>
<text x="425.0" y="211.0" font-size="11.5" fill="#555555" text-anchor="middle">catches: 32-bit sum overflow</text>
<rect x="660" y="124" width="260" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="790.0" y="149.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ThreadSanitizer</text>
<text x="790.0" y="166.5" font-size="11.5" fill="#555555" text-anchor="middle">data races</text>
<text x="790.0" y="181.5" font-size="11.5" fill="#555555" text-anchor="middle">catches: a shared accumulator</text>
<text x="320" y="272" font-size="11" fill="#1d1d1d" text-anchor="middle">ASan and UBSan combine in one build; TSan cannot join them</text>
</svg>