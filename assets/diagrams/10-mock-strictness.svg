<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="64" width="230" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="90.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">NiceMock&lt;T&gt;</text>
<text x="155.0" y="107.0" font-size="11.5" fill="#555555" text-anchor="middle">an uninteresting call is</text>
<rect x="350" y="64" width="300" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="500.0" y="90.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">silent</text>
<text x="500.0" y="107.0" font-size="11.5" fill="#555555" text-anchor="middle">allowed, no warning</text>
<rect x="40" y="144" width="230" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="155.0" y="170.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">default mock (naggy)</text>
<text x="155.0" y="187.0" font-size="11.5" fill="#555555" text-anchor="middle">an uninteresting call is</text>
<rect x="350" y="144" width="300" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="500.0" y="170.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a warning</text>
<text x="500.0" y="187.0" font-size="11.5" fill="#555555" text-anchor="middle">allowed, logs GMOCK WARNING</text>
<rect x="40" y="224" width="230" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="250.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">StrictMock&lt;T&gt;</text>
<text x="155.0" y="267.0" font-size="11.5" fill="#555555" text-anchor="middle">an uninteresting call is</text>
<rect x="350" y="224" width="300" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="500.0" y="250.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a failure</text>
<text x="500.0" y="267.0" font-size="11.5" fill="#555555" text-anchor="middle">fails the test immediately</text>
<path d="M270,92 L350,92" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M270,172 L350,172" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M270,252 L350,252" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="40" font-size="11" fill="#1d1d1d" text-anchor="middle">a call no EXPECT_CALL covers</text>
<text x="460" y="305" font-size="11" fill="#1d1d1d" text-anchor="middle">a matching EXPECT_CALL always takes priority on any of the three</text>
</svg>