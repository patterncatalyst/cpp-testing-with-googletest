# The CI translation of ci.sh: the same four stages as GitHub Actions jobs.
# Copy this to .github/workflows/tests.yml in a project to run the matrix on push.
# The sanitizer and default lanes run as a matrix; coverage is its own job with a
# gate. The toolchain is pinned so a CI run matches a local one.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The default, asan-ubsan, and tsan lanes, one matrix leg each. ASan and TSan
  # cannot share a binary, so they are separate legs, never a combined build.
  lanes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [default, asan, tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cmake ninja-build
          pipx install "conan==2.33.0"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('examples/16-ci/conanfile.py') }}

      - name: Detect a Conan profile
        run: conan profile detect --force

      - name: Run the ${{ matrix.lane }} lane
        working-directory: examples/16-ci
        run: ./demo.sh ${{ matrix.lane }}

  # Coverage is its own job: an instrumented build, a report, and a gate.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build
          pipx install "conan==2.33.0"

      - name: Detect a Conan profile
        run: conan profile detect --force

      - name: Run the coverage gate
        working-directory: examples/16-ci
        env:
          MIN_COVERAGE: "90"
        run: ./coverage.sh
